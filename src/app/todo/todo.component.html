
<div class="todo-container">

  <div class="task-input">
    <!-- 🔹 Champ d'ajout/modification -->
    <input [(ngModel)]="newTask" placeholder="Ajouter une tâche..." (keydown.enter)="addTask()">
    <button *ngIf="!editMode" class="add-button" (click)="addTask()" id="addbutton" [disabled]="newTask.trim() === ''">
      {{ editingIndex === null ? 'Ajouter' : 'Modifier' }}
    </button>
    <button *ngIf="editMode" (click)="saveTask()">Modifier</button>
  </div>


  <!-- 🔹 Message d'erreur -->
<p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

  <!-- 🔹 Liste des tâches -->
  <ul>
    <li *ngFor="let task of tasks; let i = index">
      <!-- {{task.title}} -->
      <span>{{ task.title }}</span>
      <button class="edit-button" (click)="editTask(task)">Modifier</button>
      <button class="delete-button" (click)="deleteTask(task._id)">Supprimer</button>
    </li>
  </ul>
</div>
